<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opportunity Radar</title>
<style>
body{margin:0;background:#0b1220;color:#edf3ff;font:14px system-ui}header,main,footer{max-width:1400px;margin:auto;padding:20px}h1{margin:0}.muted{color:#9ba9c0}.stats,.cards{display:grid;gap:12px}.stats{grid-template-columns:repeat(5,1fr)}.cards{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.stat,.toolbar,.card{background:#121c2e;border:1px solid #2b3a55;border-radius:14px;padding:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0;position:sticky;top:0}input,select,button{background:#1a2740;color:#fff;border:1px solid #344665;border-radius:8px;padding:9px}input{flex:1;min-width:230px}.top{display:flex;justify-content:space-between}.title{font-weight:800;font-size:17px}.company{color:#9ba9c0}.score{font-size:22px;font-weight:900}.hi{color:#65d69a}.mi{color:#f0c86b}.badge,.key{display:inline-block;background:#0d1627;border:1px solid #2b3a55;border-radius:7px;padding:4px 7px;font-size:11px;margin:3px}.reason{margin:10px 0;line-height:1.45;color:#d6deed}.actions{display:flex;gap:6px;margin-top:12px}.actions>*{flex:1;text-align:center}.actions a{background:#75a9ff;color:#07101e;text-decoration:none;padding:9px;border-radius:8px;font-weight:700}.actions button{cursor:pointer}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><h1>🎯 Opportunity Radar</h1><div class="muted">Vigo · Galicia · Norte de Portugal · Remoto · Empresarial + Fútbol</div></header><main>
<div id="stats" class="stats"></div><div class="toolbar"><input id="q" placeholder="Buscar oferta, empresa o palabra clave"><select id="sector"><option value="">Todos</option><option>Empresarial</option><option>Fútbol</option></select><select id="min"><option value="0">Cualquier encaje</option><option value="70">≥70%</option><option value="80">≥80%</option><option value="90">≥90%</option></select><select id="status"><option value="active">Pendientes</option><option value="all">Todas</option><option value="interested">Me interesan</option><option value="discarded">Descartadas</option><option value="applied">Candidatura enviada</option></select></div><div id="app"></div></main><footer class="muted">Los estados se guardan en este navegador. La base se actualizará mediante GitHub Actions cuando conectes el proveedor de búsqueda.</footer>
<script>
const K="radarState";let D,S=JSON.parse(localStorage.getItem(K)||"{}");
const e=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function state(id){return S[id]||"new"} function set(id,v){S[id]=v;localStorage.setItem(K,JSON.stringify(S));render()}
function ok(j){let q=document.querySelector("#q").value.toLowerCase(),s=document.querySelector("#sector").value,m=+document.querySelector("#min").value,f=document.querySelector("#status").value,h=[j.title,j.company,j.location,j.reason,...j.keywords].join(" ").toLowerCase();if(q&&!h.includes(q)||s&&j.sector!=s||j.score<m)return false;let x=state(j.id);return f=="all"||f=="active"?!["discarded","applied"].includes(x):x==f}
function card(j){let x=state(j.id);return `<article class="card"><div class="top"><div><div class="title">${e(j.title)}</div><div class="company">${e(j.company)}</div></div><div class="score ${j.score>=90?"hi":"mi"}">${j.score}%</div></div><div>${e(j.sector)} · ${e(j.location)} · ${e(j.mode)} · ${e(j.salary)}</div><div class="reason">${e(j.reason)}</div><div>${j.keywords.map(k=>`<span class="key">${e(k)}</span>`).join("")}</div><div class="actions"><a href="${e(j.url)}" target="_blank" onclick="set('${j.id}','seen')">🔗 Ver oferta</a><button onclick="set('${j.id}','interested')">❤️</button><button onclick="set('${j.id}','discarded')">❌</button><button onclick="set('${j.id}','applied')">✅</button></div></article>`}
function render(){let a=D.jobs.filter(ok),counts={new:0,interested:0,discarded:0,applied:0};D.jobs.forEach(j=>counts[state(j.id)]=(counts[state(j.id)]||0)+1);document.querySelector("#stats").innerHTML=[["🆕",counts.new],["🔥",D.jobs.filter(j=>j.score>=90).length],["⚽",D.jobs.filter(j=>j.sector=="Fútbol").length],["💼",D.jobs.filter(j=>j.sector=="Empresarial").length],["❤️",counts.interested]].map(x=>`<div class="stat"><b>${x[0]} ${x[1]}</b></div>`).join("");document.querySelector("#app").innerHTML=["Empresarial","Fútbol"].map(g=>`<section><h2>${g=="Fútbol"?"⚽":"💼"} ${g}</h2><div class="cards">${a.filter(j=>j.sector==g).map(card).join("")||"<div class='card'>Sin resultados con estos filtros.</div>"}</div></section>`).join("")}
fetch("data.json").then(r=>r.json()).then(x=>{D=x;render()});document.querySelectorAll("input,select").forEach(x=>x.addEventListener("input",render));
</script></body></html>
