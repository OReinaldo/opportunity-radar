<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opportunity Radar</title><style>
:root{--bg:#07101d;--p:#101b2c;--p2:#17243a;--l:#2a3a55;--t:#eef4ff;--m:#9eabc0;--b:#76aaff;--g:#63d79b;--y:#f1c96b;--r:#ff7182;--v:#b69cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#14213a,#07101d 55%);color:var(--t);font:14px system-ui}header,main,footer{max-width:1450px;margin:auto;padding:20px}h1{margin:0;font-size:30px}.muted{color:var(--m)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.stat,.toolbar,.card,.top10{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:14px}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--m)}.top10{margin:15px 0}.toprow{display:grid;grid-template-columns:35px 1fr 70px 90px;gap:10px;padding:10px 0;border-top:1px solid var(--l);align-items:center}.toprow:first-of-type{border:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:5;margin:15px 0}input,select,button{background:var(--p2);border:1px solid var(--l);border-radius:8px;color:var(--t);padding:9px 11px}input{flex:1;min-width:240px}button{cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}.section{margin:22px 0}.card{display:flex;flex-direction:column;gap:9px;transition:.15s}.card.interested{border-color:var(--g);box-shadow:0 0 0 1px #63d79b33}.card.applied{border-color:var(--b);box-shadow:0 0 0 1px #76aaff33}.card.discarded{border-color:var(--r);opacity:.7}.card.seen{border-color:var(--v)}.top{display:flex;justify-content:space-between;gap:10px}.title{font-weight:800;font-size:17px}.company{color:var(--m)}.score{font-weight:900;font-size:21px}.hi{color:var(--g)}.mi{color:var(--y)}.lo{color:var(--r)}.badge,.key,.status{font-size:10px;border:1px solid var(--l);background:#0c1627;border-radius:999px;padding:4px 7px;display:inline-block;margin:2px}.key{border-radius:5px}.status{font-weight:800}.status-interested{color:var(--g)}.status-applied{color:var(--b)}.status-discarded{color:var(--r)}.status-seen{color:var(--v)}.reason{line-height:1.45;color:#d7dfed}.why{font-size:11px;color:var(--m)}.actions{display:flex;gap:6px;margin-top:auto}.actions>*{flex:1;text-align:center}.actions a{background:var(--b);color:#07101d;text-decoration:none;padding:9px;border-radius:8px;font-weight:800}.actions button.active{outline:2px solid currentColor}.empty{padding:25px;border:1px dashed var(--l);border-radius:14px;color:var(--m);text-align:center}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.toolbar{position:static}.toprow{grid-template-columns:25px 1fr 60px}.toprow .date{display:none}}
</style></head><body><header><h1>🎯 Opportunity Radar</h1><div class="muted">Vigo · Galicia · Norte de Portugal · Remoto · Empresarial + Fútbol</div><div id="updated" class="muted"></div></header><main><div id="stats" class="stats"></div><section class="top10"><h2>🔥 TOP 10 — Oportunidades prioritarias</h2><div id="top10"></div></section><div class="toolbar"><input id="q" placeholder="Buscar puesto, empresa, ubicación o palabra clave…"><select id="sector"><option value="">Todos los sectores</option><option>Empresarial</option><option>Fútbol</option></select><select id="min"><option value="0">Cualquier encaje</option><option value="70">≥70%</option><option value="80">≥80%</option><option value="90">≥90%</option></select><select id="status"><option value="active">Pendientes</option><option value="all">Todas</option><option value="new">Nuevas</option><option value="seen">Vistas</option><option value="interested">Me interesan</option><option value="discarded">Descartadas</option><option value="applied">Candidatura enviada</option></select><select id="sort"><option value="score">Mayor encaje</option><option value="date">Más recientes</option><option value="company">Empresa</option></select><button id="reset">Restablecer</button><button id="refresh">↻ Recargar</button></div><div id="content"></div></main><footer class="muted">Los estados se guardan en este navegador. En “Todas”, las ofertas permanecen visibles y quedan resaltadas según su estado.</footer><script>
const KEY='opportunityRadarStateV2';let D={jobs:[]},S=JSON.parse(localStorage.getItem(KEY)||'{}');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const labels={new:['🆕','Nueva'],seen:['👁','Vista'],interested:['❤️','Me interesa'],discarded:['❌','Descartada'],applied:['✅','Candidatura enviada']};function state(id){return S[id]||'new'}function setState(id,v){S[id]=v;localStorage.setItem(KEY,JSON.stringify(S));render()}function match(j){let q=document.querySelector('#q').value.toLowerCase(),s=document.querySelector('#sector').value,min=+document.querySelector('#min').value,f=document.querySelector('#status').value,h=[j.title,j.company,j.location,j.mode,j.sector,j.salary,j.reason,...(j.keywords||[])].join(' ').toLowerCase();if(q&&!h.includes(q)||s&&j.sector!==s||j.score<min)return false;let x=state(j.id);if(f==='all')return true;if(f==='active')return !['discarded','applied'].includes(x);return x===f}function sorted(a){let s=document.querySelector('#sort').value;return [...a].sort((x,y)=>s==='score'?y.score-x.score:s==='company'?x.company.localeCompare(y.company):String(y.published).localeCompare(String(x.published)))}function card(j){let x=state(j.id),l=labels[x]||labels.seen;return `<article class="card ${x}"><div class="top"><div><div class="title">${esc(j.title)}</div><div class="company">${esc(j.company)}</div></div><div class="score ${j.score>=90?'hi':j.score>=80?'mi':'lo'}">${j.score}%</div></div><div class="muted">${esc(j.sector)} · ${esc(j.location)} · ${esc(j.mode)} · ${esc(j.salary)}</div><div><span class="status status-${x}">${l[0]} ${l[1]}</span> <span class="badge">${esc(j.published||'')}</span></div><div class="reason">${esc(j.reason)}</div><div class="why">Encaje basado en gestión integral, control económico, metodología, innovación, operaciones y capacidad de transferencia al fútbol.</div><div>${(j.keywords||[]).map(k=>`<span class="key">${esc(k)}</span>`).join('')}</div><div class="actions"><a href="${esc(j.url)}" target="_blank" rel="noopener" onclick="setState('${j.id}','seen')">🔗 Ver oferta</a><button class="${x==='interested'?'active':''}" onclick="setState('${j.id}','interested')">❤️</button><button class="${x==='discarded'?'active':''}" onclick="setState('${j.id}','discarded')">❌</button><button class="${x==='applied'?'active':''}" onclick="setState('${j.id}','applied')">✅</button></div></article>`}function render(){let all=D.jobs,filtered=all.filter(match),top=all.filter(j=>state(j.id)!=='discarded').sort((a,b)=>b.score-a.score).slice(0,10);document.querySelector('#top10').innerHTML=top.map((j,i)=>`<div class="toprow"><b>${i+1}</b><div><b>${esc(j.title)}</b><div class="muted">${esc(j.company)} · ${esc(j.location)}</div></div><div class="score ${j.score>=90?'hi':j.score>=80?'mi':'lo'}">${j.score}%</div><div class="date">${esc(j.sector)}</div></div>`).join('')||'<div class="empty">Sin ofertas todavía.</div>';let c={new:0,seen:0,interested:0,discarded:0,applied:0};all.forEach(j=>c[state(j.id)]++);document.querySelector('#stats').innerHTML=[['🆕',c.new,'Nuevas'],['🔥',all.filter(j=>j.score>=90).length,'Encaje ≥90%'],['⚽',all.filter(j=>j.sector==='Fútbol').length,'Fútbol'],['💼',all.filter(j=>j.sector==='Empresarial').length,'Empresarial'],['❤️',c.interested,'Me interesan'],['✅',c.applied,'Enviadas']].map(x=>`<div class="stat"><b>${x[0]} ${x[1]}</b><span>${x[2]}</span></div>`).join('');document.querySelector('#content').innerHTML=['Empresarial','Fútbol'].map(g=>{let z=sorted(filtered.filter(j=>j.sector===g));return `<section class="section"><h2>${g==='Fútbol'?'⚽':'💼'} ${g} <span class="muted">(${z.length})</span></h2><div class="cards">${z.map(card).join('')||'<div class="empty">No hay ofertas con estos filtros.</div>'}</div></section>`}).join('');document.querySelector('#updated').textContent='Última actualización: '+(D.updated_at||'—')}async function load(){D=await fetch('data.json?ts='+Date.now()).then(r=>r.json());render()}document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',render));document.querySelector('#refresh').onclick=load;document.querySelector('#reset').onclick=()=>{q.value='';sector.value='';min.value='0';status.value='active';sort.value='score';render()};load();
</script></body></html>
